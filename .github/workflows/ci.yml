name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Build web demo
        run: npm run build:web

      - name: Test
        run: npm test

      # Not scoped with --omit=dev like the pnpm repos: this package has zero
      # runtime dependencies, so a prod-only gate would never assert anything.
      - name: Audit
        run: npm audit --audit-level=high
